#
# Matches the toolchain pinned by caliptra-sw and caliptra-mcu-sw for 2.1.
# The Caliptra ROM/FW images are compiled by caliptra-builder with whatever
# toolchain runs the asset tools, so keep this in sync with upstream.
[toolchain]
channel = "1.96.1"
targets = ["wasm32-unknown-unknown", "riscv32imc-unknown-none-elf"]
profile = "minimal"
components = ["rustfmt", "clippy"]
