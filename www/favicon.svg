<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Licensed under the Apache-2.0 license

    Site icon: the Caliptra logo mark on a CRT monitor. The mark is redrawn
    from chipsalliance/Caliptra doc/images/logo/svg/Caliptra color.svg (its
    coordinates are kept, 1706 x 1218 units) with heavier traces, and its
    dark teal is lightened so it shows on the dark screen.

    Below 24px the traces get heavier still and the scanlines, glow and power
    LED are dropped. tools/make-favicons.py renders favicon.ico and
    apple-touch-icon.png from this file.
  -->
  <style>
    .trace { stroke-width: 140px; }
    .dot { stroke-width: 0; }
    @media (max-width: 24px) {
      .trace { stroke-width: 190px; }
      .dot { stroke-width: 50px; }
      .mark { filter: none; }
      .detail { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e2d7"/>
      <stop offset="1" stop-color="#b6b1a4"/>
    </linearGradient>
    <radialGradient id="phosphor" cx="0.45" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#143847"/>
      <stop offset="1" stop-color="#050d12"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="1.5" patternUnits="userSpaceOnUse">
      <rect width="4" height="0.5" fill="#000" fill-opacity="0.3"/>
    </pattern>
    <clipPath id="screen">
      <rect x="7" y="8" width="50" height="37" rx="5"/>
    </clipPath>

    <!-- Logo gradients, in the mark's coordinates. -->
    <linearGradient id="gold" x1="0" y1="0" x2="798" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2c675"/>
      <stop offset="1" stop-color="#ece190"/>
    </linearGradient>
    <linearGradient id="pale" x1="378" y1="0" x2="1176" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ece190"/>
      <stop offset="1" stop-color="#cee6bf"/>
    </linearGradient>
    <linearGradient id="teal" x1="760" y1="0" x2="1558" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cee6bf"/>
      <stop offset="1" stop-color="#3aa6cf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Stand -->
  <path d="M27 49.5h10l2 5.5H25z" fill="#9f9a8d" stroke="#4a4842"/>
  <rect x="17" y="55" width="30" height="5" rx="2" fill="url(#plastic)" stroke="#4a4842"/>

  <!-- Case and screen -->
  <rect x="2.6" y="3.6" width="58.8" height="46.8" rx="7" fill="url(#plastic)" stroke="#4a4842" stroke-width="1.2"/>
  <rect x="7" y="8" width="50" height="37" rx="5" fill="url(#phosphor)" stroke="#3a3832" stroke-width="0.8"/>

  <g clip-path="url(#screen)">
    <!-- Caliptra mark. The center trace runs in from the screen edge. -->
    <g class="mark" transform="translate(7.5 12.2) scale(0.0236)" fill="none" filter="url(#glow)">
      <path class="trace" d="M-500 570H800" stroke="url(#gold)"/>
      <path class="trace" d="M1176 313H413V843H1176" stroke="url(#pale)"/>
      <path class="trace" d="M795 313V79H1558M795 843V1136H1558" stroke="url(#teal)"/>
      <circle class="dot" cx="863" cy="570" r="110" fill="#ece190" stroke="#ece190"/>
      <circle class="dot" cx="1241" cy="313" r="110" fill="#cee6bf" stroke="#cee6bf"/>
      <circle class="dot" cx="1241" cy="843" r="110" fill="#cee6bf" stroke="#cee6bf"/>
      <circle class="dot" cx="1624" cy="79" r="110" fill="#3aa6cf" stroke="#3aa6cf"/>
      <circle class="dot" cx="1624" cy="1136" r="110" fill="#3aa6cf" stroke="#3aa6cf"/>
    </g>
    <rect class="detail" x="7" y="8" width="50" height="37" fill="url(#scanlines)"/>
    <rect x="7" y="8" width="50" height="37" fill="url(#glare)"/>
  </g>

  <!-- Power LED -->
  <circle class="detail" cx="54.5" cy="47.6" r="1.1" fill="#59d97f"/>
</svg>
