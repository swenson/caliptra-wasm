# Build the Caliptra WASM demo and publish www/ to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build and boot-test pull requests too; only pushes to main deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let in-progress runs finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caliptra-wasm
        uses: actions/checkout@v4

      - name: Install Rust toolchains
        # Each Caliptra release build in versions/<release>/ pins its
        # toolchains in rust-toolchain.toml files (2.0's asset tools use 2.0's
        # older one). Install them, with the targets they list, up front.
        run: |
          for f in versions/*/rust-toolchain.toml versions/*/tools/rust-toolchain.toml ca/rust-toolchain.toml; do
            [ -f "$f" ] && (cd "$(dirname "$f")" && rustup toolchain install)
          done

      - name: Install wasm-pack
        # Use the prebuilt binary rather than `cargo install`; it is much
        # faster to install.
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('versions/*/Cargo.toml', 'versions/*/tools/Cargo.toml', 'ca/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache downloaded Caliptra 1.x releases
        # tools/fetch-firmware.py downloads the official ROM / firmware
        # release zips listed in versions/*/firmware.json and verifies them;
        # keep them between runs.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/caliptra-mcu-sw/releases
          key: caliptra-releases-${{ hashFiles('versions/*/firmware.json') }}

      - name: Build site
        env:
          # For each release, build-wasm.sh clones swenson/caliptra-mcu-sw at
          # the rev pinned in versions/<release>/Cargo.toml and builds the MCU
          # ROM/runtime from it. The checkouts must be outside this repo (their
          # builds would otherwise find our manifests above them);
          # $RUNNER_TEMP is.
          MCU_SW_CACHE_DIR: ${{ runner.temp }}/caliptra-mcu-sw
        run: ./build-wasm.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser boot test
        # Load the built page in headless Firefox (preinstalled on the
        # runner) and boot both emulator modes of every release to their
        # runtime milestones. Blocks the deploy if any run fails.
        run: node tests/browser/boot-test.mjs

      - name: Test CA unit tests
        # The CA's own tests. Its OpenSSL interoperability test runs where
        # the openssl command has ML-DSA (3.5 or later) and is skipped
        # elsewhere.
        run: cd ca && cargo test

      - name: Browser provisioning test
        # Exercise the Test CA page, then provision every identity of every
        # release from the emulator page's Provisioning section and verify the
        # certificate chains. Blocks the deploy if any flow fails.
        run: node tests/browser/provisioning-test.mjs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
