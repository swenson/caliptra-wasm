# Licensed under the Apache-2.0 license
# Build the Caliptra WASM demo and publish www/ to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # caliptra-mcu-sw revision used to build the MCU ROM/runtime. Keep in sync
  # with the mcu-hw-model rev pinned in Cargo.toml (3e8144bf). actions/checkout
  # requires the full 40-character commit SHA to check out a specific commit.
  MCU_SW_REV: 3e8144bf3451530c28aeb1f835d483f690df6233

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caliptra-wasm
        uses: actions/checkout@v4

      - name: Checkout caliptra-mcu-sw
        # Clone OUTSIDE the caliptra-wasm working tree. The MCU build resolves
        # its Cargo workspace by walking up to the highest directory containing
        # a Cargo.toml; if mcu-sw lived inside this repo it would pick up
        # caliptra-wasm's root Cargo.toml and fail. $RUNNER_TEMP is outside the
        # workspace and has no parent Cargo.toml.
        run: |
          git clone --filter=blob:none \
            https://github.com/swenson/caliptra-mcu-sw \
            "$RUNNER_TEMP/caliptra-mcu-sw"
          cd "$RUNNER_TEMP/caliptra-mcu-sw"
          git fetch --depth 1 origin "$MCU_SW_REV"
          git checkout FETCH_HEAD

      - name: Install Rust toolchain
        # caliptra-mcu-sw pins Rust 1.85 via its own rust-toolchain.toml and
        # rustup switches to it automatically for the MCU ROM/runtime build.
        # For the rest (WASM crate + asset tools) we pin 1.87.0:
        #   * >= 1.87 is required by the WASM crate (uses is_multiple_of).
        #   * < 1.89 avoids the mismatched_lifetime_syntaxes lint, which the
        #     caliptra firmware build (compiled with -D warnings) would turn
        #     into a hard error on the pinned caliptra-sw register sources.
        run: |
          rustup toolchain install 1.87.0 --profile minimal
          rustup default 1.87.0
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        # Use the prebuilt binary rather than `cargo install`: building
        # wasm-pack from source needs a newer rustc than the 1.85 toolchain
        # required by caliptra-mcu-sw. The prebuilt binary has no such
        # constraint and is much faster to install.
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build site
        env:
          MCU_SW_DIR: ${{ runner.temp }}/caliptra-mcu-sw
        run: ./build-wasm.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
