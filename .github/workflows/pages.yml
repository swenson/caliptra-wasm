# Build the Caliptra WASM demo and publish www/ to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build and boot-test pull requests too; only pushes to main deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let in-progress runs finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caliptra-wasm
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # caliptra-wasm, caliptra-sw and caliptra-mcu-sw (main-2.1) all pin
        # Rust 1.96.1 via rust-toolchain.toml; rustup picks it up
        # automatically in each checkout. Install it (with the wasm32 and
        # riscv32imc targets listed there) up front.
        run: rustup toolchain install

      - name: Install wasm-pack
        # Use the prebuilt binary rather than `cargo install`; it is much
        # faster to install.
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build site
        env:
          # build-wasm.sh clones swenson/caliptra-mcu-sw at the rev pinned in
          # Cargo.toml and builds the MCU ROM/runtime from it. The checkout
          # must be outside this repo (its build would otherwise find
          # caliptra-wasm's Cargo.toml above it); $RUNNER_TEMP is.
          MCU_SW_CACHE_DIR: ${{ runner.temp }}/caliptra-mcu-sw
        run: ./build-wasm.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser boot test
        # Load the built page in headless Firefox (preinstalled on the
        # runner) and boot both emulator modes to their runtime milestones.
        # Blocks the deploy if either mode fails.
        run: node tests/browser/boot-test.mjs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
