#
# caliptra-builder compiles the Caliptra 2.0 ROM/FW with the toolchain that
# runs these tools, so this must match caliptra-sw 2.0's own pin.
[toolchain]
channel = "1.85"
targets = ["riscv32imc-unknown-none-elf"]
profile = "minimal"
components = ["rustfmt", "clippy"]
