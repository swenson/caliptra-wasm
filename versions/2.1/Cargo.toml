#
# caliptra-wasm built against Caliptra 2.1. The crate source is shared by all
# releases (../../src); each release has its own manifest, lockfile and
# toolchain under versions/<release>/. The `caliptra-2-1` feature selects the
# 2.1-specific code paths.

[package]
name = "caliptra-wasm-demo"
version = "0.1.0"
edition = "2021"

[lib]
path = "../../src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["caliptra-2-1"]
caliptra-2-1 = []

[lints.rust]
# The shared sources also contain code for the other releases' features.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("caliptra-1x", "caliptra-1-0", "caliptra-1-1", "caliptra-2-0", "caliptra-2-1"))'] }

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
rand = { version = "0.8", features = ["std_rng"] }
rand_core = "0.6"
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

# Caliptra dependencies; keep revs in sync
caliptra-hw-model = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "757b7445b18483d624612f03b195cbff2b415963", default-features = false }
caliptra-api = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "757b7445b18483d624612f03b195cbff2b415963" }
caliptra-api-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "757b7445b18483d624612f03b195cbff2b415963" }
caliptra-hw-model-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "757b7445b18483d624612f03b195cbff2b415963" }
caliptra-emu-periph = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "757b7445b18483d624612f03b195cbff2b415963" }
caliptra-image-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "757b7445b18483d624612f03b195cbff2b415963", default-features = false, features = ["std"] }
sha2 = "0.10"
zerocopy = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# MCU emulator. build-wasm.sh builds the MCU ROM/runtime from this same rev.
mcu-hw-model = { git = "https://github.com/swenson/caliptra-mcu-sw", rev = "c6c7ecd59e5648feed78e52e6da480fdb7f21654", package = "caliptra-mcu-hw-model", default-features = false }
# OTP fuse map (partition and field offsets) for this release.
mcu-registers-generated = { git = "https://github.com/swenson/caliptra-mcu-sw", rev = "c6c7ecd59e5648feed78e52e6da480fdb7f21654", package = "caliptra-mcu-registers-generated" }


[dev-dependencies]
# The test CA behind the CA page, for the provisioning flow tests.
caliptra-test-ca = { path = "../../ca" }

# Patch caliptra-cfi-lib with a no-asm shim for WASM (CFI uses inline asm
# that doesn't compile for wasm32; CFI is a firmware security feature not
# needed by the emulator).
[patch."https://github.com/chipsalliance/caliptra-cfi.git"]
caliptra-cfi-lib = { path = "../../cfi-shim" }

[profile.release]
opt-level = "s"
lto = true
