#
# caliptra-wasm built against the Caliptra 1.x emulator (1.0 hardware). The
# crate source is shared by all releases (../../src); each release has its
# own manifest, lockfile and toolchain under versions/<release>/. The
# `caliptra-1-0` feature selects the 1.x code paths (core only: 1.x has no
# subsystem mode or MCU).
#
# The 1.x ROM and firmware are not built here: build-wasm.sh downloads the
# official releases listed in firmware.json and checks their hashes.

[package]
name = "caliptra-wasm-demo"
version = "0.1.0"
edition = "2021"

[lib]
path = "../../src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["caliptra-1-0"]
# 1.0 hardware; caliptra-1x selects the shared 1.x code paths.
caliptra-1-0 = ["caliptra-1x"]
caliptra-1x = []

[lints.rust]
# The shared sources also contain code for the other releases' features.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("caliptra-1x", "caliptra-1-0", "caliptra-1-1", "caliptra-2-0", "caliptra-2-1"))'] }

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
rand = { version = "0.8", features = ["std_rng"] }
rand_core = "0.6"
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

# Caliptra dependencies; keep revs in sync
caliptra-hw-model = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "3f399d9f1b0d88083f027b2ba75877aacf52ab94", default-features = false, features = ["hw-1.0"] }
caliptra-api = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "3f399d9f1b0d88083f027b2ba75877aacf52ab94" }
caliptra-api-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "3f399d9f1b0d88083f027b2ba75877aacf52ab94" }
caliptra-hw-model-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "3f399d9f1b0d88083f027b2ba75877aacf52ab94" }
caliptra-emu-periph = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "3f399d9f1b0d88083f027b2ba75877aacf52ab94" }
caliptra-image-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "3f399d9f1b0d88083f027b2ba75877aacf52ab94", default-features = false, features = ["std"] }
sha2 = "0.10"
zerocopy = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The test CA behind the CA page, for the provisioning flow tests.
caliptra-test-ca = { path = "../../ca" }

[profile.release]
opt-level = "s"
lto = true
