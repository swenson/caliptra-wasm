# Helper tool to extract PK hashes from a Caliptra FW image bundle.

[package]
name = "caliptra-wasm-hash-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "build-default-assets"
path = "src/build_default_assets.rs"

[[bin]]
name = "extract-pk-hashes"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
caliptra-auth-man-gen = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e", default-features = false }
caliptra-auth-man-types = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e", default-features = false, features = ["std"] }
caliptra-builder = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e", default-features = false, features = ["rustcrypto"] }
caliptra-image-crypto = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e", default-features = false, features = ["rustcrypto"] }
caliptra-image-fake-keys = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e" }
caliptra-image-gen = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e" }
caliptra-image-types = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e", default-features = false, package = "caliptra-image-types", features = ["std"] }
sha2 = "0.10"
zerocopy = { version = "0.8", features = ["derive"] }

[patch.crates-io]
openssl = { git = "https://github.com/clundin25/rust-openssl.git", rev = "4ada1c1d7c264e052e7bb71ecddbd196a5c2a0c7" }
