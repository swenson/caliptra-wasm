[package]
name = "caliptra-wasm-demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
rand = { version = "0.8", features = ["std_rng"] }
rand_core = "0.6"
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

# Caliptra dependencies; keep revs in sync
caliptra-hw-model = { git = "https://github.com/swenson/caliptra-sw", rev = "df412daf506b5f46c28df029e57e5779a0449056", default-features = false }
caliptra-api-types = { git = "https://github.com/swenson/caliptra-sw", rev = "df412daf506b5f46c28df029e57e5779a0449056" }
caliptra-hw-model-types = { git = "https://github.com/swenson/caliptra-sw", rev = "df412daf506b5f46c28df029e57e5779a0449056" }
caliptra-emu-periph = { git = "https://github.com/swenson/caliptra-sw", rev = "df412daf506b5f46c28df029e57e5779a0449056" }

# MCU emulator
mcu-hw-model = { git = "https://github.com/swenson/caliptra-mcu-sw", rev = "dba0876", default-features = false }


# Patch caliptra-cfi-lib with a no-asm shim for WASM (CFI uses inline asm
# that doesn't compile for wasm32; CFI is a firmware security feature not
# needed by the emulator).
[patch."https://github.com/chipsalliance/caliptra-cfi.git"]
caliptra-cfi-lib = { path = "cfi-shim" }

[profile.release]
opt-level = "s"
lto = true
