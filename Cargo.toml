[package]
name = "caliptra-wasm-demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
rand = { version = "0.8", features = ["std_rng"] }
rand_core = "0.6"
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

# Caliptra dependencies; keep revs in sync
caliptra-hw-model = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e", default-features = false }
caliptra-api = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e" }
caliptra-api-types = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e" }
caliptra-hw-model-types = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e" }
caliptra-emu-periph = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e" }
caliptra-image-types = { git = "https://github.com/swenson/caliptra-sw", rev = "0615298556a83be37a4e9962787478d955ef548e", default-features = false, features = ["std"] }
sha2 = "0.10"
zerocopy = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pin pkcs8 / der to the rc.10 prerelease that matches ml-dsa 0.1.0-rc.7's API.
# pkcs8 0.11.0 final and der 0.8.0 final made breaking API changes that
# ml-dsa-rc.7 has not been updated for. Listing them here ensures cargo's
# resolver keeps them at the rc revision rather than upgrading.
pkcs8 = "=0.11.0-rc.10"
der = "=0.8.0-rc.10"

# MCU emulator
mcu-hw-model = { git = "https://github.com/swenson/caliptra-mcu-sw", rev = "3e8144bf", default-features = false }


# Patch caliptra-cfi-lib with a no-asm shim for WASM (CFI uses inline asm
# that doesn't compile for wasm32; CFI is a firmware security feature not
# needed by the emulator).
[patch."https://github.com/chipsalliance/caliptra-cfi.git"]
caliptra-cfi-lib = { path = "cfi-shim" }

[patch.crates-io]
openssl = { git = "https://github.com/clundin25/rust-openssl.git", rev = "4ada1c1d7c264e052e7bb71ecddbd196a5c2a0c7" }

[profile.release]
opt-level = "s"
lto = true
